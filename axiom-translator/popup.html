<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; background: #16171c; color: #e8e8ea; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    select, input[type=number] { background: #23252d; color: inherit; border: 1px solid #3a3d48; border-radius: 6px; padding: 3px 6px; }
    input[type=number] { width: 50px; }
    .hint { color: #8b8e99; font-size: 11px; margin: -6px 0 10px; }
    button { width: 100%; padding: 6px; background: #23252d; color: inherit; border: 1px solid #3a3d48; border-radius: 6px; cursor: pointer; }
    button:hover { background: #2d303a; }
    #status { color: #4ade80; font-size: 11px; min-height: 14px; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <h1>Axiom Translator</h1>
  <label>Переводить <input type="checkbox" id="enabled"></label>
  <label>Язык
    <select id="targetLang">
      <option value="ru">Русский</option>
      <option value="uk">Українська</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="tr">Türkçe</option>
      <option value="zh-CN">中文</option>
    </select>
  </label>
  <label>Мин. слов в тексте <input type="number" id="minWords" min="1" max="10"></label>
  <div class="hint">1 — переводить всё подряд, 3+ — только фразы (меньше переводов кнопок и названий токенов)</div>
  <label>Оригинал при наведении <input type="checkbox" id="showOriginalOnHover"></label>
  <button id="clearCache">Очистить кэш переводов</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
